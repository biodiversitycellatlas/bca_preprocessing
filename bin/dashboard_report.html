<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Biodiversity Cell Atlas – Preprocessing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.plot.ly/plotly-3.3.0.min.js" charset="utf-8"></script>

  <!-- ==================================================== -->
  <!-- CSS styling                                          -->
  <!-- ==================================================== -->
  <style>
    :root {
      --header-color: #239184;
      --main-bg: #f0f0f0;
      --box-bg: #ffffff;
      --text-dark: #1e1e1e;
      --border: #ddd;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      max-width: 100vw;
    }

    body {
      margin: 0;
      background: var(--main-bg);
      color: var(--text-dark);
    }

    main {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .box {
      background: var(--box-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .collapse-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .collapsible .box-content {
      margin-top: 12px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--border);
    }

    .tab {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      border-bottom: 3px solid var(--header-color);
      font-weight: 600;
    }

    .tab-content {
      padding-top: 16px;
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    .hidden {
      display: none;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .tabs {
        overflow-x: auto;
        white-space: nowrap;
      }
    }

    /**********************************************************************
    * HEADER
    **********************************************************************/
    .logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 8px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: var(--header-color);
      color: white;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-placeholder {
      width: 30px;
      height: 30x;
      background: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .header-text h1 {
      margin: 0;
      font-size: 22px;
    }

    .header-text h2 {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }


    .header-left {
      display: flex;
      align-items: center;
    }

    .header-left .logo {
      height: 50px;
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .github-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #ffac3e;
      border: 2px solid #ffac3e;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }

    .github-btn:hover {
      background-color: #ffab3ed0;
      color: white;
    }

    .github-logo {
      height: 20px;
      width: 20px;
      fill: currentColor;
      display: block;
    }


    /**********************************************************************
    * SAMPLE SELECTOR
    **********************************************************************/
    .sample-bar {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sample-bar select {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      background: #ffab3e6c;
    }


    /**********************************************************************
    * SCROLLABLE TABLES
    **********************************************************************/
    /* Constrain box and box-content */
    .box {
      width: 100%;
      max-width: 100vw;      /* do not let box exceed viewport */
      overflow-x: hidden;    /* parent hides overflow */
      box-sizing: border-box;
    }

    .box-content {
      width: 100%;
      overflow-x: hidden;    /* prevent parent scroll */
      box-sizing: border-box;
    }

    /* Scroll wrapper */
    .table-scroll {
      display: block;        /* must be block to enable scroll */
      width: 100%;
      overflow-x: auto;      /* horizontal scroll */
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }

    /* Constrain table */
    .table-scroll table {
      border-collapse: collapse;
      width: max-content;    /* table can be wider than container */
      min-width: 100%;       /* fills container if narrower */
    }

    /* Cells */
    .table-scroll th,
    .table-scroll td {
      white-space: nowrap;
      padding: 8px 12px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
    }

    /* Sticky header */
    .table-scroll th {
      position: sticky;
      top: 0;
      background: white;
      z-index: 2;
      cursor: pointer;
    }

    /* Stripe odd rows */
    .table-scroll tbody tr:nth-child(odd) {
      background-color: rgba(59, 188, 178, 0.15);
    }

    /* Hover highlight */
    .table-scroll tbody tr:hover {
      background-color: rgba(59, 188, 177, 0.514);
    }

    /* Custom scrollbar */
    .table-scroll::-webkit-scrollbar {
      height: 8px;
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }

    .table-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }



    /**********************************************************************
    * SORTABLE TABLES
    **********************************************************************/

    /* Sortable column styling */
    th {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .sort-indicator {
      font-size: 0.8em;
      opacity: 0.7;
    }


    /**********************************************************************
    * MAPPING TAB CARDS
    **********************************************************************/
    /* Container for the cards */
    .mapping-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    /* Card styling */
    .mapping-cards .card {
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: white;
    }

    /* Image header */
    .mapping-cards .card-header-img {
      position: relative;
      width: 100%;
      height: 80px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-start; /* top */
      padding: 8px 12px;
    }

    /* Title on top-left */
    .mapping-cards .card-header-img .card-title {
      color: white;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      font-size: 1.2rem;
      position: absolute;
      top: 8px;
      left: 12px;
      pointer-events: none; /* prevents blocking hover */
    }

    /* Credit appears only on hover */
    .mapping-cards .card-header-img figcaption {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(255,255,255,0.75);
      padding: 2px 6px;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mapping-cards .card-header-img:hover figcaption {
      opacity: 1;
    }

    /* Stats inside card body - two-column table */
    .mapping-cards .card-body {
      padding: 12px;
      color: var(--text-dark);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .mapping-cards .card-body table {
      width: 100%;
      border-collapse: collapse;
    }

    .mapping-cards .card-body td {
      padding: 3px 6px;
    }

    .mapping-cards .card-body td.key {

      text-align: left;
      width: 80%;
    }

    .mapping-cards .card-body td.value {
      text-align: right;
      width: 20%;
    }



    /**********************************************************************
    * CELL CALLING
    **********************************************************************/
    .cellcalling-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .cellcalling-left,
    .cellcalling-right {
      display: flex;
      flex-direction: column;
      justify-content: center; /* vertical center */
      align-items: center;     /* horizontal center if needed */
    }

    .cellcalling-right {
      height: 100%;
    }

    .cellcalling-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .plot-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }

    .plot-btn.active {
      background: var(--header-color);
      color: white;
      border-color: var(--header-color);
    }

    #kneeplot {
      flex: 1;
      min-height: 350px;
      width: 100%;
    }

    .cellcalling-right button {
      padding: 6px 12px;
      border: 1px solid var(--header-color);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-weight: 500;
    }

    .cellcalling-right button.active {
      background: var(--header-color);
      color: white;
    }

    .cellcalling-right button:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
      border-color: #999;
    }


    /**********************************************************************
    * CITATION / INFO BOXES
    **********************************************************************/
    .citation-box {
      background-color: rgba(35, 145, 132, 0.08);
      border-left: 4px solid var(--header-color);
      padding: 12px 16px;
      padding-right: 40px;
      margin-bottom: 20px;
      border-radius: 0 6px 6px 0;
      color: #333;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
    }

    .citation-box p {
      margin: 0 0 8px 0;
    }

    .citation-box p:last-child {
      margin-bottom: 0;
    }

    .citation-link {
      position: absolute;
      top: 12px;
      right: 12px;
      color: var(--header-color);
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .citation-link:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .citation-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Ensure Plotly text is always visible regardless of global SVG rules */
    .js-plotly-plot .main-svg text {
      fill: #444 !important; /* Force a dark grey color for labels */
    }

    /* Specific Reset for Plotly Text */
    .js-plotly-plot .main-svg text,
    .js-plotly-plot .main-svg .xtitle,
    .js-plotly-plot .main-svg .ytitle,
    .js-plotly-plot .main-svg .g-gtitle text {
    fill: #1e1e1e !important;   /* Force dark grey/black */
    color: #1e1e1e !important;
    opacity: 1 !important;
    font-family: system-ui, -apple-system, sans-serif !important;
    }

    /* Fix for Axis Labels specifically */
    .js-plotly-plot .g-xtitle,
    .js-plotly-plot .g-ytitle {
    display: block !important;
    visibility: visible !important;
    }

    /* Ensure the containers don't clip the titles */
    .tab-pane {
    overflow: visible !important;
    }

    #kneeplot, [id^="plot"] {
    margin-top: 10px;
    }

  </style>

</head>

  <script>
    /**********************************************************************
     * JSON LOADING
     **********************************************************************/
    function loadEmbeddedJSON(id) {
      const el = document.getElementById(id);
      if (!el) return null;

      try {
        const txt = el.textContent.trim();
        if (!txt || txt.startsWith("__")) return null;
        return JSON.parse(txt);
      } catch (e) {
        console.error("Invalid JSON in", id, e);
        return null;
      }
    }

    /**********************************************************************
     * GLOBAL STATE
     **********************************************************************/
    window._samples = [];
    window._currentSample = null;

    /**********************************************************************
     * MAIN ENTRY
     **********************************************************************/
    function loadAll() {
      const meta = loadEmbeddedJSON("run-metadata-data");
      const global = loadEmbeddedJSON("global-data");
      const data = loadEmbeddedJSON("samples-data");
      const images = loadEmbeddedJSON("saturation-images") || {};
      window._saturationImages = images; // Store globally for easy access in tabs

      if (meta) renderHeader(meta);
      if (global) renderGlobalSummary(global);

      if (data && data.samples.length > 0) {
        window._samples = data.samples;
        initSampleSelector(data.samples);
        window._currentSample = data.samples[0];
        renderSample(window._currentSample);
      }
    }

    /**********************************************************************
     * HEADER
     **********************************************************************/
    function renderHeader(meta) {
      document.getElementById("pipeline-version").textContent =
        `v${meta.version} • ${meta.date}`;
    }

    /**********************************************************************
     * GLOBAL SUMMARY
     **********************************************************************/
    function renderGlobalSummary(global) {
      const cols = global.overview.columns;
      const rows = global.overview.rows;

      const table = document.getElementById("overview-table-table");

      table.innerHTML = `
        <thead>
          <tr>
            ${cols.map((c, i) => `
              <th data-col="${i}" data-type="auto">
                <span class="th-label">${c}</span>
                <span class="sort-indicator">↕</span>
              </th>
            `).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              ${row.map(cell => `<td>${cell}</td>`).join("")}
            </tr>
          `).join("")}
        </tbody>
      `;

      makeTableSortable(table);
    }

    function makeTableSortable(table) {
      let sortState = { col: null, dir: 1 };

      table.querySelector("thead").addEventListener("click", e => {
        const th = e.target.closest("th");
        if (!th) return;

        const col = Number(th.dataset.col);

        if (sortState.col === col) {
          sortState.dir *= -1;
        } else {
          sortState.col = col;
          sortState.dir = 1;
        }

        sortTableByColumn(table, col, sortState.dir);
        updateSortIndicators(table, col, sortState.dir);
      });
    }

    function parseValue(text) {
      const cleaned = text.replace(/[%,$]/g, "").trim();

      // scientific or float
      const num = Number(cleaned);
      if (!isNaN(num)) return { type: "number", value: num };

      return { type: "string", value: text.toLowerCase() };
    }

    function sortTableByColumn(table, colIndex, dir) {
      const tbody = table.tBodies[0];
      const rows = Array.from(tbody.rows);

      rows.sort((a, b) => {
        const A = parseValue(a.cells[colIndex]?.textContent || "");
        const B = parseValue(b.cells[colIndex]?.textContent || "");

        if (A.type === "number" && B.type === "number") {
          return (A.value - B.value) * dir;
        }

        return A.value.localeCompare(B.value, undefined, { numeric: true }) * dir;
      });

      const frag = document.createDocumentFragment();
      rows.forEach(r => frag.appendChild(r));
      tbody.appendChild(frag);
    }

    function updateSortIndicators(table, col, dir) {
      table.querySelectorAll("th").forEach(th => {
        const indicator = th.querySelector(".sort-indicator");
        indicator.textContent = "↕";     // reset to neutral
        th.classList.remove("sorted");
      });

      const th = table.querySelector(`th[data-col="${col}"]`);
      if (!th) return;

      const indicator = th.querySelector(".sort-indicator");
      indicator.textContent = dir === 1 ? "▲" : "▼";
      th.classList.add("sorted");
    }


    /**********************************************************************
     * SAMPLE SELECTOR
     **********************************************************************/
    function initSampleSelector(samples) {
      const sel = document.getElementById("sample-select");
      sel.innerHTML = "";
      samples.forEach((s, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${s.sample_id}`;
        sel.appendChild(opt);
      });
      sel.onchange = async () => {
        window._currentSample = samples[sel.value];

        // Only render the visible tab
        const activeTab = document.querySelector(".tab.active");
        if (!activeTab) return;

        const tabId = activeTab.dataset.tab;

        if (tabId === "mapping") renderMapping(window._currentSample);
        if (tabId === "saturation") renderSaturation(window._currentSample);
        if (tabId === "cellcalling") renderCellCalling(window._currentSample);
        if (tabId === "percell") renderPerCell(window._currentSample);
        if (tabId === "taxonomic") renderTaxonomy(window._currentSample);
        if (tabId === "config") renderConfigForSample(window._currentSample);
      };

    }

    /**********************************************************************
     * RENDER SAMPLE
     **********************************************************************/
    function renderSample(sample) {
      renderMapping(sample);
      renderSaturation(sample);
      renderCellCalling(sample);
      renderPerCell(sample);
      renderTaxonomy(sample);
      renderConfigForSample(sample);
    }

    /**********************************************************************
     * SATURATION TAB
     **********************************************************************/
    function renderSaturation(sample) {
      // Retrieve the base64 strings
      const sampleImages = window._saturationImages ? window._saturationImages[sample.sample_id] : null;

      // Use a fallback or empty string if images are missing
      const satImg = sampleImages ? sampleImages.saturation : "";
      const resImg = sampleImages ? sampleImages.residuals : "";

      document.getElementById("saturation").innerHTML = `
        <h3>Saturation Plots</h3>

        <div class="citation-box">
          <a href="https://github.com/zolotarovgl/10x_saturate" target="_blank" class="citation-link" title="More info on GitHub">
            <svg viewBox="0 0 16 16" version="1.1" aria-hidden="true">
              <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
          </a>

          <p>
            Sequencing saturation is a measure of the fraction of library complexity that was sequenced in a given experiment.
            The inverse of one minus the sequencing saturation can be interpreted as the number of additional reads it would
            take to detect a new transcript.
          </p>
          <p>
            It's useful to examine residuals plot to see if the model tends to over or under estimate the coverage needeed.
          </p>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <img src="${satImg}" style="width:48%;" alt="Saturation Plot">
          <img src="${resImg}" style="width:48%;" alt="Residuals Plot">
        </div>
      `;
    }

    /**********************************************************************
     * CELL CALLING TAB
     **********************************************************************/
    function renderCellCalling(sample) {
      const c = sample.cell_calling;

      document.getElementById("cellcalling").innerHTML = `
        <h3>Cell Calling</h3>

        <div class="cellcalling-grid">

          <div class="cellcalling-left">
            <div class="table-scroll">
              <table>
                <tbody>
                  <tr><td>Expected Number of Cells</td><td>${c.expected_cells.toLocaleString()}</td></tr>
                  <tr><td>Number of Cells</td><td>${c.num_cells.toLocaleString()}</td></tr>
                  <tr><td>UMI cutoff for Cell Calling</td><td>${c.umi_threshold.toLocaleString()}</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="cellcalling-right" style="flex-direction: column;">
            <div style="display:flex; gap:10px; margin-bottom:10px; justify-content:center;">
              <button id="btnKnee" class="active">Knee Plot</button>
              <button id="btnDeriv">2nd Derivative</button>
            </div>
            <div id="kneeplot" style="flex:1; width:100%; height:100%;"></div>
          </div>

        </div>
      `;

      // Button logic
      const btnKnee = document.getElementById("btnKnee");
      const btnDeriv = document.getElementById("btnDeriv");

      btnKnee.onclick = () => {
        btnKnee.classList.add("active");
        btnDeriv.classList.remove("active");
        renderKneePlot(c);
      };

      btnDeriv.onclick = async () => {
        btnDeriv.classList.add("active");
        btnKnee.classList.remove("active");
        renderSecondDerivative(c);
      };

      // Default: show knee plot
      renderKneePlot(c);
    }

    function loadKneeUMIs(sampleId) {
      const knee = loadEmbeddedJSON("knee-data");
      return knee ? knee[sampleId] : null;
    }

    function renderKneePlot(c) {
      const sampleId = window._currentSample.sample_id;
      const yAll = loadKneeUMIs(sampleId);
      if (!yAll || yAll.length === 0) return;

      const xAll = Array.from({ length: yAll.length }, (_, i) => i + 1);
      const cutoff = c.umi_threshold;

      // Split by cutoff
      const xAbove = [];
      const yAbove = [];
      const xBelow = [];
      const yBelow = [];

      for (let i = 0; i < yAll.length; i++) {
        if (yAll[i] > cutoff) {
          xAbove.push(xAll[i]);
          yAbove.push(yAll[i]);
        } else {
          xBelow.push(xAll[i]);
          yBelow.push(yAll[i]);
        }
      }

      Plotly.purge("kneeplot");

      Plotly.newPlot("kneeplot", [
        {
          x: xBelow, y: yBelow,
          mode: "lines+markers",
          type: "scatter",
          name: "Non-cells",
          line: { width: 2, color: "lightgrey" },
          marker: { color: "lightgrey", size: 5 }
        },
        {
          x: xAbove, y: yAbove,
          mode: "lines+markers",
          type: "scatter",
          name: "Cells",
          line: { width: 2, color: "green" },
          marker: { color: "green", size: 5 }
        }
      ], {
        title: {
          text: "Barcode Rank Plot (STARsolo threshold)",
          font: { family: 'Arial, sans-serif', size: 16, color: '#1e1e1e' }
        },
        xaxis: {
          title: { text: "Barcode rank", font: { color: '#1e1e1e' } },
          type: "log",
          tickfont: { color: '#1e1e1e' },
          gridcolor: '#f0f0f0'
        },
        yaxis: {
          title: { text: "Total UMIs", font: { color: '#1e1e1e' } },
          type: "log",
          tickfont: { color: '#1e1e1e' },
          gridcolor: '#f0f0f0'
        },
        margin: { t: 80, l: 60, b: 60, r: 40 },
        paper_bgcolor: 'white',
        plot_bgcolor: 'white',
        showlegend: false,

        shapes: [{
          type: 'line',
          xref: 'paper',
          x0: 0,
          x1: 1,
          yref: 'y',
          y0: cutoff,
          y1: cutoff,
          line: {
            color: 'grey',
            width: 2,
            dash: 'dot'
          }
        }],

        annotations: [{
          xref: 'paper',
          x: 1,
          yref: 'y',
          y: Math.log10(cutoff),
          text: `UMI threshold: ${cutoff.toLocaleString()}`,
          showarrow: false,
          font: { color: 'grey', size: 12 },
          bgcolor: 'rgba(255, 255, 255, 0.8)',
          xanchor: 'right',
          yanchor: 'bottom'
        }]
      }, { responsive: true });
    }


    function renderSecondDerivative(c) {
      const sampleId = window._currentSample.sample_id;
      const rawUmis = loadKneeUMIs(sampleId);

      if (!rawUmis || rawUmis.length === 0) {
        document.getElementById("kneeplot").innerHTML = "<p>No data available</p>";
        return;
      }

      // --- CONSTANTS ---
      const UMI_MIN_THRESHOLD = 10;   // Minimum reads
      const SMOOTHING_WINDOW = 200;   // Window size for moving average
      const TRIM_EDGE = 15;           // Edge trimming for minima detection

      // --- DATA PREPARATION ---
      // Sort descending
      const sorted = [...rawUmis].sort((a, b) => b - a);

      // Apply initial UMI filter
      const filtered = sorted.filter(v => v >= UMI_MIN_THRESHOLD);

      if (filtered.length < (TRIM_EDGE * 2)) {
        document.getElementById("kneeplot").innerHTML = "<p>Not enough data points > 10 UMIs</p>";
        return;
      }

      // Prepare math arrays
      const ranks = filtered.map((_, i) => i + 1);
      let cumSum = [];
      let curr = 0;
      for (let val of filtered) { curr += val; cumSum.push(curr); }

      const logX = ranks.map(r => Math.log10(r));
      const logY = cumSum.map(c => Math.log10(c));

      // --- DERIVATIVE CALCULATIONS ---
      // 1st Derivative
      let d1 = [];
      for (let i = 0; i < logX.length - 1; i++) {
        d1.push((logY[i+1] - logY[i]) / (logX[i+1] - logX[i]));
      }

      // 2nd Derivative
      let d2 = [];
      for (let i = 0; i < d1.length - 1; i++) {
        d2.push((d1[i+1] - d1[i]) / (logX[i+1] - logX[i]));
      }

      // Smoothing (Python: np.convolve(data, ones/window, mode='same'))
      const smoothed2nd = movingAverage(d2, SMOOTHING_WINDOW);

      // --- MINIMA DETECTION ---
      const maxVal = Math.max(...smoothed2nd);
      const plotCurve = smoothed2nd.map(v => v - maxVal);

      let selectedIdx = 0;

      // Search_area = smoothed_2nd[trim_edge:-trim_edge]
      let minVal = Infinity;
      // Search within the trimmed bounds
      for (let i = TRIM_EDGE; i < smoothed2nd.length - TRIM_EDGE; i++) {
        if (smoothed2nd[i] < minVal) {
          minVal = smoothed2nd[i];
          selectedIdx = i;
        }
      }

      // --- RENDER Plotly ---
      const derivX = logX.slice(1, -1);

      // Threshold Data
      const cutX = logX[selectedIdx];
      const cutReads = filtered[selectedIdx];

      Plotly.purge("kneeplot");

      // Trace 1: Cumulative Reads
      const trace1 = {
        x: logX, y: logY,
        name: 'log10(Cumulative Reads)',
        type: 'scatter', mode: 'lines',
        line: {color: '#2c3e50', width: 2.5},
        customdata: filtered.map((reads, i) => [ranks[i], reads]),
        hovertemplate: '<b>Rank:</b> %{customdata[0]:,}<br><b>UMI:</b> %{customdata[1]:,}<br><b>log(CumSum):</b> %{y:.3f}<extra></extra>'
      };

      // Trace 2: 2nd Derivative
      const trace2 = {
        x: derivX, y: plotCurve,
        name: '2nd Derivative of log10(Cumulative Reads)',
        type: 'scatter', mode: 'lines',
        line: {color: '#e74c3c', width: 1.5},
        opacity: 0.8,
        yaxis: 'y2',
        hovertemplate: '<b>2nd Deriv:</b> %{y:.3f}<extra></extra>'
      };

      Plotly.newPlot('kneeplot', [trace1, trace2], {
        title: {
          text: `Cell Calling using 2nd Derivative`,
          font: { family: 'Arial, sans-serif', size: 16, color: '#1e1e1e' },
          y: 0.95
        },
        template: 'plotly_white',
        hovermode: 'x unified',
        showlegend: false,
        xaxis: {
          title: { text: 'log10(Barcode Rank)', font: { size: 12, weight: 'bold', color: '#1e1e1e' } },
          tickfont: { color: '#1e1e1e' },
          showgrid: true,
          gridcolor: 'rgba(0,0,0,0.1)'
        },
        yaxis: {
          title: { text: 'log10(Cumulative Reads)', font: { size: 12, weight: 'bold', color: '#34495e' } },
          tickfont: { color: '#34495e' },
          side: 'left',
          showgrid: true,
          gridcolor: 'rgba(0,0,0,0.1)'
        },
        yaxis2: {
          title: { text: '2nd Derivative of log10(Cumulative Reads)', font: { size: 12, weight: 'bold', color: '#e74c3c' } },
          overlaying: 'y',
          side: 'right',
          showgrid: false,
          tickfont: { color: '#e74c3c' }
        },
        margin: { t: 80, r: 60, b: 60, l: 60 },

        // Vertical Threshold Line
        shapes: [{
            type: 'line', x0: cutX, x1: cutX, y0: 0, y1: 1,
            xref: 'x', yref: 'paper',
            line: { color: '#c0392b', width: 2, dash: 'dash' }
        }],

        annotations: [{
            x: cutX,
            y: logY[selectedIdx],
            xref: 'x',
            yref: 'y',
            text: `UMI Threshold: ${cutReads.toLocaleString()}`,
            font: { color: '#2c3e50', size: 12 },
            showarrow: true,
            arrowhead: 2,
            arrowcolor: 'black',
            ax: 40,
            ay: -40,
            bgcolor: 'rgba(255, 255, 255, 0.9)',
            bordercolor: '#ccc',
            borderwidth: 1
        }]
      }, {responsive: true});
    }

    function movingAverage(data, size) {
      let res = [];
      const halfWindow = Math.floor(size / 2);

      for (let i = 0; i < data.length; i++) {
        // Define window bounds ensuring we stay within array limits
        let start = Math.max(0, i - halfWindow);
        let end = Math.min(data.length, i + halfWindow + 1);

        let sum = 0;
        for (let j = start; j < end; j++) {
          sum += data[j];
        }
        res.push(sum / (end - start));
      }
      return res;
    }

    /**********************************************************************
     * PER-CELL TAB
     **********************************************************************/
    function renderPerCell(sample) {
        const container = document.getElementById("percell");
        container.innerHTML = `
            <h3>Per-Cell Visualizations</h3>
            <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:15px; width:100%;">
                ${[1, 2, 3, 4, 5, 6].map(i =>
                `<div id="plot${i}" style="width:100%; height:350px;"></div>`
                ).join("")}
            </div>
        `;

        const threshold = sample.cell_calling.umi_threshold;
        const allPerCell = loadEmbeddedJSON("percell-data");
        const rawData = allPerCell ? allPerCell[sample.sample_id] : null;
        if (!rawData) return;

        const keys = Object.keys(rawData);
        const rowCount = rawData[keys[0]].length;
        const perCellData = [];
        for (let i = 0; i < rowCount; i++) {
            let row = {};
            keys.forEach(key => { row[key] = rawData[key][i]; });
            perCellData.push(row);
        }

        const combos = [
        {
          id: "plot1",
          x: "IntronicPercent", xLabel: "% Intronic",
          y: "MTPercent",       yLabel: "% mtDNA",
          title: "% Intronic vs % mtDNA"
        },
        {
          id: "plot2",
          x: "IntronicPercent", xLabel: "% Intronic",
          y: "rRNAPercent",     yLabel: "% rRNA",
          title: "% Intronic vs % rRNA"
        },
        {
          id: "plot3",
          x: "IntronicPercent", xLabel: "% Intronic",
          y: "TotalReads",      yLabel: "Total UMIs",
          title: "% Intronic vs Total UMIs"
        },
        {
          id: "plot4",
          x: "MTPercent",       xLabel: "% mtDNA",
          y: "rRNAPercent",     yLabel: "% rRNA",
          title: "% mtDNA vs % rRNA"
        },
        {
          id: "plot5",
          x: "MTPercent",       xLabel: "% mtDNA",
          y: "TotalReads",      yLabel: "Total UMIs",
          title: "% mtDNA vs Total UMIs"
        },
        {
          id: "plot6",
          x: "rRNAPercent",     xLabel: "% rRNA",
          y: "TotalReads",      yLabel: "Total UMIs",
          title: "% rRNA vs Total UMIs"
        }
      ];

      combos.forEach(c => {
        Plotly.purge(c.id);

        const below = perCellData.filter(d => d.TotalReads <= threshold);
        const above = perCellData.filter(d => d.TotalReads > threshold);

        const traceBelow = {
          x: below.map(d => d[c.x]), // Keeps using the data key
          y: below.map(d => d[c.y]),
          mode: "markers",
          type: "scattergl",
          name: "Non-Cell",
          marker: { color: "lightgrey", size: 4, opacity: 0.6 }
        };

        const traceAbove = {
          x: above.map(d => d[c.x]),
          y: above.map(d => d[c.y]),
          mode: "markers",
          type: "scattergl",
          name: "Cell",
          marker: { color: "#ffac3e", size: 4, opacity: 0.8 }
        };

        Plotly.newPlot(c.id, [traceBelow, traceAbove], {
          title: {
            text: c.title,
            font: { family: 'Arial, sans-serif', size: 14, color: '#1e1e1e' },
            pad: { b: 10 }
          },
          xaxis: {
            title: { text: c.xLabel, font: { color: '#1e1e1e', size: 12 } }, // Uses new label
            tickfont: { color: '#1e1e1e' },
            gridcolor: '#eee'
          },
          yaxis: {
            title: { text: c.yLabel, font: { color: '#1e1e1e', size: 12 } }, // Uses new label
            tickfont: { color: '#1e1e1e' },
            gridcolor: '#eee'
          },
          margin: { l: 60, r: 30, b: 60, t: 60 },
          paper_bgcolor: 'white',
          plot_bgcolor: 'white',
          showlegend: true,
          legend: { x: 1, y: 1.1, xanchor: 'right', yanchor: 'bottom', orientation: 'h' }
        }, { responsive: true });
      });
    }


    /**********************************************************************
     * TAXONOMY TAB
     **********************************************************************/

    async function renderTaxonomy(sample) {
        // Check if Sankey data exists
        const sankeyData = sample.taxonomy_sankey;

        if (!sankeyData || !sankeyData.nodes || !sankeyData.links) {
            document.getElementById("taxonomic").innerHTML = `
                <h3>Taxonomic Classification</h3>
                <p>No taxonomy data available for this sample.</p>`;
            return;
        }

        const { nodes, links } = sankeyData;

        // Calculate values for each Node
        // Check if 'nodes.value' exists (user preference), if not, calculate it by summing incoming link values
        let nodeValues = [];

        if (nodes.value && Array.isArray(nodes.value)) {
            nodeValues = nodes.value;
        } else {
            // Initialize with 0s
            nodeValues = new Array(nodes.name.length).fill(0);

            // Sum incoming flows (Target)
            // Note: Roots (sources with no incoming links) might remain 0 with this method
            // unless they are explicitly defined in nodes.value or are targets of a hidden root
            if (links.target && links.value) {
                links.target.forEach((targetIndex, i) => {
                    if (typeof nodeValues[targetIndex] === 'number') {
                        nodeValues[targetIndex] += links.value[i];
                    }
                });
            }
        }

        // Create Taxonomy Entries for the Table (Label + Value)
        const taxonomyEntries = nodes.name.map((label, i) => ({
            label: label,
            value: nodeValues[i] || 0
        }))
        // Filter out 0 counts if hiding unlinked nodes
        .filter(item => item.value > 0)
        .sort((a, b) => b.value - a.value);

        // Compute total for percentages (Sum of all displayed nodes)
        const total = taxonomyEntries.reduce((sum, item) => sum + item.value, 0);

        // Build table rows
        const tableRows = taxonomyEntries.map((item) => {
            const pct = total > 0 ? ((item.value / total) * 100).toFixed(2) : "0.00";
            return `<tr>
                    <td>${item.label}</td>
                    <td>${item.value.toLocaleString()}</td>
                    <td>${pct}%</td>
                    </tr>`;
        }).join("");

        // Render Layout (Table + Sankey Container)
        document.getElementById("taxonomic").innerHTML = `
            <h3>Taxonomic Classification of Unmapped Reads</h3>
            <div class="taxonomic-grid" style="display:flex; gap:20px; flex-wrap:wrap; align-items: flex-start;">

            <div class="taxonomic-left" style="flex:1; min-width:300px; max-width:500px;">
                <div class="table-scroll" style="max-height: 500px; overflow-y: auto; border: 1px solid #eee;">
                <table style="width:100%; border-collapse: collapse; font-family: sans-serif; font-size: 14px;">
                    <thead style="position: sticky; top: 0; background: #f9f9f9; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                    <tr>
                        <th style="text-align:left; padding:8px; border-bottom: 2px solid #ddd;">Taxon</th>
                        <th style="text-align:left; padding:8px; border-bottom: 2px solid #ddd;">Count</th>
                        <th style="text-align:left; padding:8px; border-bottom: 2px solid #ddd;">%</th>
                    </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
                </div>
            </div>

            <div class="taxonomic-right" style="flex:1; min-width:400px;">
                <div id="sankey-container" style="width:100%; height:500px;"></div>
            </div>

            </div>
        `;

        // Render Plotly Sankey
        // Map node groups to colors if available
        const nodeColors = nodes.group
            ? nodes.group.map(() => "#1f77b4")
            : Array(nodes.name.length).fill("#1f77b4");

        Plotly.newPlot("sankey-container", [{
            type: "sankey",
            orientation: "h",
            node: {
                label: nodes.name,
                color: nodeColors,
                pad: sankeyData.options?.nodePadding || 10,
                thickness: sankeyData.options?.nodeWidth || 15,
                line: { color: "#000", width: 0.5 }
            },
            link: {
                source: links.source,
                target: links.target,
                value: links.value,
                color: sankeyData.options?.linkColor || "rgba(160,160,160,0.5)"
            }
        }], {
            font: { size: sankeyData.options?.fontSize || 12 },
            margin: { t: 20, l: 20, r: 20, b: 20 }
        }, { responsive: true });

        // Resize listener
        window.addEventListener("resize", () => {
            const plot = document.getElementById("sankey-container");
            if (plot && Plotly.Plots.resize) Plotly.Plots.resize(plot);
        });
    }



    /**********************************************************************
     * CONFIG TAB
     **********************************************************************/
    function renderConfigForSample(sample) {
      const c = sample.config || {};
      const entries = Object.entries(c);

      if (entries.length === 0) {
        document.getElementById("config").innerHTML =
          `<h3>Configurations</h3><p>No configuration available.</p>`;
        return;
      }

      document.getElementById("config").innerHTML = `
        <h3>Configurations</h3>

        <div class="table-scroll">
          <table>
            <tbody>
              ${entries.map(([k, v]) => `
                <tr>
                  <td>${formatKey(k)}</td>
                  <td>${formatValue(v)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function formatKey(k) {
      return k
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function formatValue(v) {
      if (v === null) return "<i>null</i>";
      if (typeof v === "boolean") return v ? "true" : "false";
      if (typeof v === "number") return v.toLocaleString();
      if (Array.isArray(v)) return v.join(", ");
      if (typeof v === "object") return `<pre>${JSON.stringify(v, null, 2)}</pre>`;
      return v;
    }

    /**********************************************************************
     * UI INTERACTIONS
     **********************************************************************/
    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");

        if (!window._currentSample) return;

        if (tab.dataset.tab === "taxonomic")
          renderTaxonomy(window._currentSample);

        if (tab.dataset.tab === "config")
          renderConfigForSample(window._currentSample);
      };
    });


    document.querySelector(".collapse-btn").onclick = () => {
      document.querySelector(".collapsible .box-content").classList.toggle("hidden");
    };

    /**********************************************************************
     * LOAD DASHBOARD
     **********************************************************************/
    loadAll();

  </script>
