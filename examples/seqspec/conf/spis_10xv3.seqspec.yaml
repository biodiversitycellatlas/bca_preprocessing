!Assay
seqspec_version: 0.4.0
assay_id: spis-10x-v3-demo
name: 10x Genomics 3' v3 (Stylophora pistillata 10x example)
doi: ''
date: 18 November 2026
description: >-
  seqspec description of the reads in examples/10x/test_data, used to run them with
  protocol 'seqspec'. Read 1 holds the 16-nt cell barcode and the 12-nt UMI, read 2
  the cDNA. The barcode onlist is the 10x v3 whitelist the 10x example downloads.
  The sequencing kit is illustrative: the run's kit is not recorded with the data.
modalities:
- rna
lib_struct: ''
sequence_protocol: Illumina NextSeq 500 (EFO:0009173)
sequence_kit: NextSeq 500/550 High-Output v2.5 Kit
library_protocol: single-cell RNA sequencing assay (OBI:0002631)
library_kit: 10x Genomics Chromium Single Cell 3' v3
sequence_spec:
- !Read
  read_id: R1
  name: Read 1
  modality: rna
  primer_id: truseq_read1
  min_len: 28
  max_len: 28
  strand: pos
  files:
  - !File
    file_id: spis_10x_R1.fastq.gz
    filename: spis_10x_R1.fastq.gz
    filetype: fastq
    filesize: 64160
    url: ../../10x/test_data/spis_10x_R1.fastq.gz
    urltype: local
    md5: b4830dc5eff9ac6b5ee3a25a87cf5263
- !Read
  read_id: R2
  name: Read 2
  modality: rna
  primer_id: truseq_read2
  min_len: 56
  max_len: 56
